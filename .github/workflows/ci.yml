name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify product
        run: pnpm verify

      - name: Publish suite comparison summary
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          pnpm --silent blueprint:suite-diff \
            examples/core.suite-report.json \
            examples/core-candidate.suite-report.json \
            --format markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Publish declared change fixture summary
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          pnpm --silent blueprint:suite-change \
            examples/core.suite-report.json \
            examples/core-candidate.suite-report.json \
            --plan examples/core.suite-change-plan.json \
            --as-of 2026-08-08 \
            --format markdown >> "$GITHUB_STEP_SUMMARY"
